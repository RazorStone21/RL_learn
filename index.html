<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>强化学习的数学原理</title>
<link rel="stylesheet" href="assets/course.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; }

  .app { display: flex; height: 100vh; }

  /* ---------- 侧栏 ---------- */
  .sidebar {
    flex: 0 0 19rem;
    display: flex;
    flex-direction: column;
    background: var(--paper-2);
    border-right: 1px solid var(--rule);
    overflow: hidden;
  }
  .side-head { padding: 1.4rem 1.25rem 1rem; border-bottom: 1px solid var(--rule); }
  .side-head h1 { font-size: 1.16rem; margin: 0 0 .2rem; letter-spacing: -.01em; }
  .side-head .sub {
    font-family: var(--sans); font-size: .76rem; color: var(--muted);
    margin: 0; letter-spacing: .02em;
  }
  .overall { margin-top: .9rem; }
  .bar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .overall p {
    font-family: var(--sans); font-size: .74rem; color: var(--muted);
    margin: .4rem 0 0; display: flex; justify-content: space-between;
  }
  .overall .overall-time { margin-top: .15rem; display: block; font-size: .72rem; }
  .resume {
    margin-top: .8rem; width: 100%; font-family: var(--sans); font-size: .82rem;
    padding: .45rem; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  .resume:hover { background: color-mix(in srgb, var(--accent) 85%, #000); }
  .resume-hint {
    font-family: var(--sans); font-size: .72rem; color: var(--muted);
    margin: .38rem 0 0; line-height: 1.45; min-height: 1em;
  }

  .toc { flex: 1; overflow-y: auto; padding: .6rem 0 1.5rem; }
  .toc-part {
    font-family: var(--sans); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); padding: 1.1rem 1.25rem .4rem; margin: 0;
  }
  .toc-item {
    display: flex; align-items: baseline; gap: .5rem;
    padding: .38rem 1.25rem .38rem 1.25rem;
    font-family: var(--sans); font-size: .85rem; line-height: 1.4;
    color: var(--ink-soft); text-decoration: none; border: 0;
    border-left: 3px solid transparent; cursor: pointer;
  }
  .toc-item:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--ink); }
  .toc-item.is-active { background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-left-color: var(--accent); color: var(--ink); font-weight: 600; }
  .toc-num {
    font-family: var(--mono); font-size: .74rem; color: var(--muted);
    flex: 0 0 2.9rem; white-space: nowrap;
  }
  .toc-item.is-read .toc-num::after { content: " ✓"; color: var(--good); font-size: .85em; }
  .toc-dot {
    flex: 0 0 auto; margin-left: auto; font-size: .7rem; color: var(--muted);
    font-family: var(--mono);
  }
  .toc-item.is-done .toc-dot { color: var(--good); }
  .toc-item.is-last:not(.is-active) .toc-title::before {
    content: "▸ "; color: var(--accent); font-size: .85em;
  }

  .side-foot {
    border-top: 1px solid var(--rule); padding: .7rem 1.25rem;
    font-family: var(--sans); font-size: .78rem; display: flex; flex-wrap: wrap; gap: .75rem;
  }
  .side-foot a { color: var(--muted); border: 0; }
  .side-foot a:hover { color: var(--accent); }
  .side-data {
    display: flex; gap: .4rem; padding: 0 1.25rem .85rem;
  }
  .mini {
    flex: 1; font-family: var(--sans); font-size: .72rem; padding: .32rem .2rem;
    cursor: pointer; border: 1px solid var(--rule); border-radius: 5px;
    background: var(--paper); color: var(--muted);
  }
  .mini:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- 主区 ---------- */
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 1rem;
    padding: .55rem 1.1rem; border-bottom: 1px solid var(--rule);
    background: var(--paper); font-family: var(--sans); font-size: .8rem; color: var(--muted);
  }
  #crumb { color: var(--ink-soft); }
  .pystatus { margin-left: auto; font-family: var(--mono); font-size: .74rem; }
  .pystatus.is-ready { color: var(--good); }
  .pystatus.is-error { color: var(--bad); }
  .pystatus.is-offline { color: var(--muted); }
  .view { flex: 1; border: 0; width: 100%; background: var(--paper); }

  .boot-error {
    max-width: 34rem; margin: 4rem auto; padding: 1.5rem;
    font-family: var(--sans); font-size: .92rem; line-height: 1.7;
    background: var(--bad-bg); border: 1px solid var(--bad); border-radius: 8px;
  }
  .boot-error code { font-size: .85em; }
  .boot-error h2 { font-family: var(--sans); border: 0; margin-top: 0; font-size: 1.05rem; }

  .toast {
    position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    font-family: var(--sans); font-size: .82rem; line-height: 1.5;
    padding: .55rem .95rem; border-radius: 6px; z-index: 60;
    box-shadow: var(--shadow); max-width: 80vw;
  }

  /* 目录开关按钮：宽屏隐藏 */
  .nav-toggle {
    display: none;
    font-family: var(--sans); font-size: .82rem;
    padding: .3rem .6rem; margin-right: .1rem;
    border: 1px solid var(--rule); border-radius: 5px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  .scrim { position: fixed; inset: 0; background: rgba(10,10,16,.42); z-index: 15; }

  /* ---------- 窄屏（手机 / 竖屏平板）：侧栏收成抽屉 ----------
     窄屏上把侧栏常驻会吃掉大半个屏幕，正文只剩一条缝。
     这里改成：默认隐藏，点顶栏「目录」滑出，选中课程或点遮罩即收起。 */
  @media (max-width: 46rem) {
    .nav-toggle { display: inline-flex; align-items: center; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: min(86vw, 20rem);
      max-height: none;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: 0 0 0 100vmax rgba(0,0,0,0);
      border-right: 1px solid var(--rule);
    }
    .app.nav-open .sidebar {
      transform: none;
      box-shadow: 0 8px 32px rgba(10,10,16,.28);
    }
    .stage { width: 100%; }
    .topbar { gap: .4rem; }
    #crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  /* 窄屏也别让长英文串把版面撑破 */
  .side-head .sub { overflow-wrap: anywhere; }
  @media (max-width: 46rem) {
    .pystatus { display: none; }   /* 手机上这行挤不下，先藏起来 */
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="side-head">
      <h1 id="course-title">强化学习的数学原理</h1>
      <p class="sub" id="course-sub">正在载入课程…</p>
      <div class="overall">
        <div class="bar"><span id="overall-bar"></span></div>
        <p><span id="overall-text">0 / 0 课已读</span><span id="overall-pct">0%</span></p>
        <p class="overall-time" id="overall-time"></p>
      </div>
      <button class="resume" id="resume" type="button">开始学习 →</button>
      <p class="resume-hint" id="resume-hint"></p>
    </div>
    <nav class="toc" id="toc" aria-label="课程目录"></nav>
    <div class="side-foot">
      <a href="reference/glossary.html" data-ref>术语表</a>
      <a href="reference/algorithms.html" data-ref>算法速查</a>
      <a href="reference/notation.html" data-ref>符号表</a>
      <a href="MISSION.md" data-ref>Mission</a>
    </div>
    <div class="side-data">
      <button class="mini" id="exportBtn" type="button" title="把进度存成 JSON 文件">导出进度</button>
      <button class="mini" id="importBtn" type="button" title="从 JSON 文件恢复进度">导入</button>
      <button class="mini" id="clearBtn" type="button" title="清空本机进度">清除</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="stage">
    <div class="topbar">
      <button class="nav-toggle" id="navToggle" type="button"
              aria-label="打开课程目录" aria-expanded="false">目录</button>
      <span id="crumb">—</span>
      <span class="pystatus" id="pystatus">Python 运行时：点「运行」时加载</span>
    </div>
    <iframe class="view" id="view" title="课程内容" src="about:blank"></iframe>
  </main>

</div>

<div class="toast" id="toast" hidden></div>

<!-- 课表由 tools/build-manifests.mjs 从 lessons/manifest.json 生成。
     用 <script> 而不是 fetch，才能在 file:// 下正常启动。 -->
<script src="assets/manifests.js"></script>
<script src="assets/store.js"></script>
<script src="assets/runner.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
